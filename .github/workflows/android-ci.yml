name: Android CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle/wrapper/**', 'build.gradle.kts', 'app/**/build.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Inject CI secrets into gradle.properties
        run: |
          mkdir -p "$GITHUB_WORKSPACE"
          touch "$GITHUB_WORKSPACE/gradle.properties"

          if [ -n "$SHOPIFY_ACCESS_TOKEN" ]; then
            if grep -q '^SHOPIFY_ACCESS_TOKEN=' "$GITHUB_WORKSPACE/gradle.properties"; then
              sed -i "s|^SHOPIFY_ACCESS_TOKEN=.*|SHOPIFY_ACCESS_TOKEN=$SHOPIFY_ACCESS_TOKEN|" "$GITHUB_WORKSPACE/gradle.properties"
            else
              printf '\nSHOPIFY_ACCESS_TOKEN=%s\n' "$SHOPIFY_ACCESS_TOKEN" >> "$GITHUB_WORKSPACE/gradle.properties"
            fi
            echo "Injected SHOPIFY_ACCESS_TOKEN into gradle.properties"
          else
            echo "SHOPIFY_ACCESS_TOKEN secret not set; skipping injection"
          fi

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Run unit tests (all flavors)
        run: ./gradlew test --no-daemon --stacktrace

      - name: Run lint
        run: ./gradlew lintDebug --no-daemon --stacktrace

      - name: Assemble release on main branch
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload release artifacts
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/**/release/*.apk

      - name: Upload debug artifact for dev branch
        if: success() && github.ref == 'refs/heads/dev'
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/**/debug/*.apk