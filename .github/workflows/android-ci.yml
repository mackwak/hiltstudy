name: CI - Fastlane -> Firebase App Distribution

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build-and-upload:
    # 에뮬레이터 성능을 위해 macOS가 유리하지만, 비용을 고려해 ubuntu-latest 유지 시 설정을 최적화합니다.
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Run Unit Tests
        run: bundle exec fastlane test

      - name: Run UI Tests (Instrumented)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 600
          # 하드웨어 가속이 없는 환경을 위한 핵심 옵션
          emulator-options: >
            -no-window 
            -gpu swiftshader_indirect 
            -no-audio 
            -no-boot-anim 
            -camera-back none
          script: bundle exec fastlane uitest flavor:developmentExtra

      - name: Build & upload via Fastlane
        run: bundle exec fastlane build flavor:developmentExtra build_type:release
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STOREFILE: ${{ secrets.STOREFILE }}