name: CI - Fastlane -> Firebase App Distribution

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build-and-upload:
    # 에뮬레이터 성능을 위해 macOS가 유리하지만, 비용을 고려해 ubuntu-latest 유지 시 설정을 최적화합니다.
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Run Unit Tests
        run: bundle exec fastlane test

      - name: Build & upload via Fastlane
        run: bundle exec fastlane build flavor:developmentExtra build_type:debug
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}