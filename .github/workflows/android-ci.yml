name: CI - Fastlane -> Firebase App Distribution

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    env:
      # Opt into Node.js 24 to clear the deprecation warning
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Run Unit Tests
        run: bundle exec fastlane test

    - name: Run UI Tests (Instrumented)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31 # 조금 더 가벼운 버전 권장
          target: google_apis
          arch: x86_64
          disable-animations: true
          # 핵심 가속 및 무력화 옵션
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim
          script: bundle exec fastlane uitest flavor:developmentExtra

      - name: Build & upload via Fastlane
        run: bundle exec fastlane build flavor:developmentExtra build_type:debug
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}